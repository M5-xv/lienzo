<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lienzo">
<meta name="theme-color" content="#07080b">
<link rel="apple-touch-icon" href="icon.png">
<title>Lienzo</title>
<style>
/* Lienzo · cyberpunk minimalista. Apto Safari iOS 12: sin flex-gap, sin inset, sin blur pesado */
:root{
  --bg:#07080b; --fg:#d8dee9; --fg2:rgba(216,222,233,.62); --fg3:rgba(216,222,233,.34);
  --panel:#0a0c10; --panel2:#10131a; --line:rgba(216,222,233,.12);
  --accent:#00e5ff; --accent2:#ff2e88; --ok:#39ff88;
  --mono:Menlo,"SF Mono","Courier New",monospace;
}
body.t-neon{--accent:#00e5ff;--accent2:#ff2e88}
body.t-magenta{--accent:#ff2e88;--accent2:#00e5ff}
body.t-acido{--accent:#b6ff00;--accent2:#00e5ff}
body.t-ambar{--accent:#ffb000;--accent2:#ff2e88}
body.t-mono{--accent:#f2f2f2;--accent2:#808080}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:0}
input,textarea,select{font:inherit;color:var(--fg);-webkit-user-select:text;user-select:text;border-radius:0}

/* ---------- Fondo: grilla tenue + resplandor del color de acento ---------- */
#wall{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;background-color:var(--bg);
  background-image:
    linear-gradient(rgba(216,222,233,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(216,222,233,.035) 1px,transparent 1px);
  background-size:28px 28px,28px 28px}
#wall:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-30%;height:65%;
  background:radial-gradient(ellipse at center,var(--accent) 0%,transparent 65%);opacity:.13}

/* ---------- Inicio ---------- */
#home{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 30px) 20px 0}
#widget{padding:0 2px 22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tag{font-size:10px;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
#hora{font-size:58px;font-weight:200;letter-spacing:-2px;line-height:1;margin-top:8px;color:#fff}
#hora b{color:var(--accent);font-weight:200}
#fecha{font-size:12px;color:var(--fg2);margin-top:10px;text-transform:uppercase;letter-spacing:2px}
#clima-w{font-size:12px;color:var(--fg2);margin-top:4px;min-height:16px;text-transform:uppercase;letter-spacing:2px}
#clima-w span{color:var(--accent)}
#grid{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -5px}
.app{width:25%;padding:7px 5px 9px;text-align:center}
.ic{width:58px;height:58px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  font-size:13px;letter-spacing:1px;color:var(--accent);border:1px solid var(--accent);background:rgba(7,8,11,.6);
  position:relative}
.ic:after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;background:var(--bg);
  border-left:1px solid var(--accent);border-bottom:1px solid var(--accent)}
.ic.main{background:var(--accent);color:var(--bg);font-weight:700}
.app span{display:block;font-size:9px;margin-top:7px;color:var(--fg2);text-transform:uppercase;letter-spacing:1.5px}
.app:active .ic{background:var(--accent);color:var(--bg)}
#dock{margin:0 -20px;padding:12px 15px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--accent);
  background:rgba(7,8,11,.85);display:flex}
#dock .app span{display:none}
#dock .app{padding:3px 5px}

/* ---------- Pantallas de app ---------- */
.screen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;background:var(--panel);display:flex;flex-direction:column;
  -webkit-transform:translateX(100%);transform:translateX(100%);transition:-webkit-transform .22s ease-out,transform .22s ease-out}
.screen.on{-webkit-transform:none;transform:none}
.bar{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 26px) 16px 12px;border-bottom:1px solid var(--line)}
.bar h1{flex:1;font-size:12px;font-weight:400;text-align:center;text-transform:uppercase;letter-spacing:4px;color:#fff}
.bar h1:before{content:"// ";color:var(--accent)}
.bar button{width:76px;color:var(--accent);font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:1.5px}
.bar button.r{text-align:right}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}

/* ---------- Claude ---------- */
#chat .body{padding-bottom:6px}
.msg{max-width:88%;padding:9px 12px;margin:6px 0;font-size:14px;line-height:1.45;
  white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.msg.u{margin-left:auto;border:1px solid var(--accent);color:#fff;background:rgba(0,0,0,.2)}
.msg.a{border-left:2px solid var(--accent2);padding-left:12px;color:var(--fg)}
.msg.a:before{content:"> ";color:var(--accent2)}
.msg.a.dots:before,.msg.a.btnw:before{content:""}
.msg.s{max-width:100%;color:var(--fg3);font-size:10px;text-align:center;padding:4px;text-transform:uppercase;letter-spacing:2px}
.msg b{color:var(--accent)}
.msg img{max-width:100%;display:block;margin-bottom:6px;border:1px solid var(--line)}
.accion{display:inline-block;padding:9px 14px;border:1px solid var(--accent);color:var(--accent);font-size:12px;
  text-transform:uppercase;letter-spacing:1.5px}
.accion:active{background:var(--accent);color:var(--bg)}
.dots span{display:inline-block;width:8px;height:14px;margin-right:4px;background:var(--accent2);
  -webkit-animation:b 1s steps(2) infinite;animation:b 1s steps(2) infinite}
.dots span:nth-child(2){-webkit-animation-delay:.2s;animation-delay:.2s}
.dots span:nth-child(3){-webkit-animation-delay:.4s;animation-delay:.4s}
@-webkit-keyframes b{50%{opacity:.15}} @keyframes b{50%{opacity:.15}}
#composer{display:flex;align-items:flex-end;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--panel)}
#composer textarea{flex:1;resize:none;max-height:110px;padding:9px 10px;border:1px solid var(--line);border-bottom-color:var(--accent);
  background:var(--panel2);font-size:16px;line-height:1.3;outline:0}
#composer button{width:40px;height:38px;margin-left:8px;font-size:11px;flex-shrink:0;letter-spacing:1px}
#send{background:var(--accent);color:var(--bg);font-weight:700}
#composer #foto-btn{border:1px solid var(--line);color:var(--fg2);margin:0 8px 0 0}
#adjunto{display:none;padding:8px 14px 0;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}

/* ---------- Listas (Notas / Tareas) ---------- */
.item{border:1px solid var(--line);border-left:2px solid var(--accent);padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.item h3{font-size:13px;font-weight:700;margin-bottom:5px;color:#fff;text-transform:uppercase;letter-spacing:1px}
.item p{font-size:14px;color:var(--fg2);white-space:pre-wrap;line-height:1.45;-webkit-user-select:text;user-select:text}
.item small{display:block;color:var(--fg3);font-size:10px;margin-top:8px;letter-spacing:1.5px}
.item .del{float:right;color:var(--accent2);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.tarea{display:flex;align-items:center}
.tarea .chk{width:20px;height:20px;border:1px solid var(--accent);margin-right:12px;flex-shrink:0;text-align:center;line-height:18px;font-size:12px}
.tarea.hecha{border-left-color:var(--fg3)}
.tarea.hecha .chk{background:var(--accent);color:var(--bg)}
.tarea.hecha .t{text-decoration:line-through;color:var(--fg3)}
.tarea .t{flex:1;font-size:14px}
.vacio{color:var(--fg3);text-align:center;margin-top:50px;font-size:11px;text-transform:uppercase;letter-spacing:2px;line-height:1.7}
.campo{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--panel2);font-size:16px;outline:0;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.campo:focus{border-color:var(--accent)}
textarea.campo{min-height:100px;resize:vertical}
.btn{display:block;width:100%;padding:13px;background:var(--accent);color:var(--bg);font-weight:700;font-size:12px;text-align:center;text-transform:uppercase;letter-spacing:2px}
.btn.sec{background:none;border:1px solid var(--line);color:var(--fg2)}
.btn.peligro{background:none;border:1px solid var(--accent2);color:var(--accent2)}
.lbl{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:3px;margin:24px 0 10px}
.lbl:first-child{margin-top:0}
.nota-txt{font-size:11px;color:var(--fg3);margin:2px 0 0;line-height:1.5}

/* ---------- Clima ---------- */
.clima-hoy{padding:16px 0 28px;border-bottom:1px solid var(--line);margin-bottom:6px}
.clima-hoy .t{font-size:76px;font-weight:200;letter-spacing:-3px;color:#fff;line-height:1.1}
.clima-hoy .t b{color:var(--accent);font-weight:200}
.clima-hoy .d{font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:2px}
.dia{display:flex;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
.dia b{flex:1;font-weight:400}
.dia i{font-style:normal;width:56px;color:var(--accent)}
.dia em{font-style:normal;width:84px;text-align:right;color:var(--fg2)}

/* ---------- Ajustes ---------- */
.fondos{display:flex;flex-wrap:wrap;margin:0 -4px}
.fondos button{width:52px;height:52px;margin:4px;border:1px solid var(--line);position:relative;font-size:9px;letter-spacing:1px;padding-top:30px}
.fondos button.sel{border-color:#fff}
.fondos button i{position:absolute;top:10px;left:50%;margin-left:-8px;width:16px;height:16px}
</style>
</head>
<body>
<div id="wall"></div>

<!-- INICIO -->
<main id="home">
  <section id="widget">
    <div class="tag">Lienzo // iPhone 6</div>
    <div id="hora">--:--</div>
    <div id="fecha"></div>
    <div id="clima-w"></div>
  </section>
  <nav id="grid"></nav>
  <nav id="dock"></nav>
</main>

<!-- CLAUDE -->
<section class="screen" id="chat">
  <div class="bar"><button onclick="cerrar()">‹ Inicio</button><h1>Claude</h1><button class="r" onclick="nuevaCharla()">Nueva</button></div>
  <div class="body" id="msgs"></div>
  <div id="adjunto">[img] Foto lista · <a href="#" onclick="quitarFoto();return false" style="color:var(--accent2)">quitar</a></div>
  <div id="composer">
    <button id="foto-btn" onclick="document.getElementById('foto-in').click()">IMG</button>
    <input type="file" id="foto-in" accept="image/*" style="display:none">
    <textarea id="txt" rows="1" placeholder="Pedile algo a Claude…"></textarea>
    <button id="send" onclick="enviar()">&gt;</button>
  </div>
</section>

<!-- NOTAS -->
<section class="screen" id="notas">
  <div class="bar"><button onclick="cerrar()">‹ Inicio</button><h1>Notas</h1><button class="r" onclick="nuevaNota()">Nueva</button></div>
  <div class="body" id="notas-l"></div>
</section>

<!-- TAREAS -->
<section class="screen" id="tareas">
  <div class="bar"><button onclick="cerrar()">‹ Inicio</button><h1>Tareas</h1><button class="r" onclick="limpiarHechas()">Limpiar</button></div>
  <div class="body">
    <input class="campo" id="tarea-in" placeholder="Nueva tarea y Enter">
    <div id="tareas-l"></div>
  </div>
</section>

<!-- CLIMA -->
<section class="screen" id="clima">
  <div class="bar"><button onclick="cerrar()">‹ Inicio</button><h1>Clima</h1><button class="r" onclick="cargarClima(true)">↻</button></div>
  <div class="body" id="clima-l"><div class="vacio">Cargando…</div></div>
</section>

<!-- AJUSTES -->
<section class="screen" id="ajustes">
  <div class="bar"><button onclick="cerrar()">‹ Inicio</button><h1>Ajustes</h1><button></button></div>
  <div class="body">
    <div class="lbl">Clave de la API de Claude</div>
    <input class="campo" id="key-in" type="password" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="nota-txt">Se guarda solo en este teléfono. La conseguís en console.anthropic.com → API Keys.</div>
    <div class="lbl">Modelo</div>
    <select class="campo" id="modelo-in">
      <option value="claude-haiku-5-5">Haiku 5.5 · rápido y barato</option>
      <option value="claude-sonnet-5-5">Sonnet 5.5 · equilibrado</option>
      <option value="claude-opus-5-5">Opus 5.5 · el más capaz</option>
    </select>
    <div class="lbl">Tu nombre</div>
    <input class="campo" id="nombre-in" placeholder="Cómo querés que te llame">
    <button class="btn" onclick="guardarAjustes()">Guardar</button>
    <div class="lbl">Tema</div>
    <div class="fondos" id="fondos"></div>
    <div class="lbl">Datos</div>
    <button class="btn peligro" onclick="borrarTodo()">Borrar notas, tareas y charlas</button>
  </div>
</section>

<script>
/* =========================================================
   Lienzo · launcher para iPhone 6 controlado por Claude
   ========================================================= */

// ---------- Almacenamiento ----------
function leer(k, def){ try{ var v = localStorage.getItem('lz_'+k); return v === null ? def : JSON.parse(v); }catch(e){ return def; } }
function guardar(k, v){ try{ localStorage.setItem('lz_'+k, JSON.stringify(v)); }catch(e){} }

var S = {
  key: leer('key',''), modelo: leer('modelo','claude-haiku-5-5'), nombre: leer('nombre',''),
  fondo: leer('fondo','neon'), notas: leer('notas',[]), tareas: leer('tareas',[]),
  historial: leer('historial',[]), chatVista: leer('chatVista',[])
};
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }

// ---------- Apps ----------
var APPS = [
  {id:'chat',    n:'Claude',   e:'AI',   dock:true},
  {id:'notas',   n:'Notas',    e:'NOT'},
  {id:'tareas',  n:'Tareas',   e:'TAR'},
  {id:'clima',   n:'Clima',    e:'CLI'},
  {id:'telefono',n:'Teléfono', e:'TEL',  url:'tel:', dock:true},
  {id:'mensajes',n:'Mensajes', e:'SMS',  url:'sms:', dock:true},
  {id:'mail',    n:'Mail',     e:'@',    url:'mailto:'},
  {id:'mapas',   n:'Mapas',    e:'MAP',  url:'https://maps.apple.com/'},
  {id:'musica',  n:'Música',   e:'MUS',  url:'music://', dock:true},
  {id:'fotos',   n:'Fotos',    e:'FOT',  url:'photos-redirect://'},
  {id:'safari',  n:'Web',      e:'WEB',  url:'https://www.google.com/'},
  {id:'ajustes', n:'Ajustes',  e:'CFG'}
];
var FONDOS = {neon:'#00e5ff', magenta:'#ff2e88', acido:'#b6ff00', ambar:'#ffb000', mono:'#f2f2f2'};
if(!FONDOS[S.fondo]) S.fondo='neon';

function iconoHTML(a){
  return '<button class="app" onclick="abrir(\''+a.id+'\')"><div class="ic'+(a.id==='chat'?' main':'')+'">'+a.e+'</div><span>'+a.n+'</span></button>';
}
function pintarInicio(){
  var g='', d='';
  APPS.forEach(function(a){ if(a.dock) d+=iconoHTML(a); else g+=iconoHTML(a); });
  $('grid').innerHTML=g; $('dock').innerHTML=d;
  document.body.className='t-'+S.fondo;
}
var abierta=null;
function abrir(id){
  var a=APPS.filter(function(x){return x.id===id;})[0];
  if(a && a.url){ window.location.href=a.url; return; }
  if(!$(id)) return;
  if(abierta) $(abierta).classList.remove('on');
  abierta=id; $(id).classList.add('on');
  if(id==='notas') pintarNotas();
  if(id==='tareas') pintarTareas();
  if(id==='clima') cargarClima(false);
  if(id==='ajustes') pintarAjustes();
  if(id==='chat'){ pintarChat(); if(!S.key) avisoSinClave(); }
}
function cerrar(){ if(abierta){ $(abierta).classList.remove('on'); abierta=null; } document.activeElement && document.activeElement.blur(); }

// ---------- Reloj ----------
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function reloj(){
  var n=new Date(), h=n.getHours(), m=n.getMinutes();
  $('hora').innerHTML=(h<10?'0':'')+h+'<b>:</b>'+(m<10?'0':'')+m;
  $('fecha').textContent=DIAS[n.getDay()]+' '+n.getDate()+' de '+MESES[n.getMonth()];
}

// ---------- Notas ----------
function pintarNotas(){
  if(!S.notas.length){ $('notas-l').innerHTML='<div class="vacio">Sin notas. Tocá "Nueva" o pedíselo a Claude.</div>'; return; }
  $('notas-l').innerHTML=S.notas.slice().reverse().map(function(n){
    return '<div class="item"><button class="del" onclick="borrarNota(\''+n.id+'\')">Borrar</button><h3>'+esc(n.titulo||'Sin título')+'</h3><p>'+esc(n.texto)+'</p><small>'+new Date(n.t).toLocaleDateString('es-AR')+'</small></div>';
  }).join('');
}
function nuevaNota(){
  $('notas-l').innerHTML='<input class="campo" id="n-tit" placeholder="Título"><textarea class="campo" id="n-txt" placeholder="Escribí…"></textarea><button class="btn" onclick="guardarNotaManual()">Guardar nota</button><div style="height:10px"></div><button class="btn sec" onclick="pintarNotas()">Cancelar</button>';
  $('n-tit').focus();
}
function guardarNotaManual(){ var t=$('n-txt').value.trim(); if(!t) return; agregarNota($('n-tit').value.trim(), t); pintarNotas(); }
function agregarNota(titulo, texto){ var n={id:uid(), titulo:titulo, texto:texto, t:Date.now()}; S.notas.push(n); guardar('notas',S.notas); return n; }
function borrarNota(id){ S.notas=S.notas.filter(function(n){return n.id!==id;}); guardar('notas',S.notas); pintarNotas(); }

// ---------- Tareas ----------
function pintarTareas(){
  if(!S.tareas.length){ $('tareas-l').innerHTML='<div class="vacio">Nada pendiente.</div>'; return; }
  var ord=S.tareas.slice().sort(function(a,b){ return (a.hecha?1:0)-(b.hecha?1:0); });
  $('tareas-l').innerHTML=ord.map(function(t){
    return '<div class="item tarea'+(t.hecha?' hecha':'')+'" onclick="alternarTarea(\''+t.id+'\')"><div class="chk">'+(t.hecha?'✓':'')+'</div><div class="t">'+esc(t.texto)+(t.fecha?'<small>'+esc(t.fecha)+'</small>':'')+'</div></div>';
  }).join('');
}
function agregarTarea(texto, fecha){ var t={id:uid(), texto:texto, fecha:fecha||'', hecha:false}; S.tareas.push(t); guardar('tareas',S.tareas); return t; }
function alternarTarea(id){ S.tareas.forEach(function(t){ if(t.id===id) t.hecha=!t.hecha; }); guardar('tareas',S.tareas); pintarTareas(); }
function limpiarHechas(){ S.tareas=S.tareas.filter(function(t){return !t.hecha;}); guardar('tareas',S.tareas); pintarTareas(); }

// ---------- Clima (Open-Meteo, sin clave) ----------
var WMO={0:['CLR','Despejado'],1:['CLR','Mayormente despejado'],2:['NUB','Parcialmente nublado'],3:['NUB','Nublado'],45:['NIE','Niebla'],48:['NIE','Niebla'],
  51:['LLV','Llovizna'],53:['LLV','Llovizna'],55:['LLV','Llovizna'],61:['LLV','Lluvia leve'],63:['LLV','Lluvia'],65:['LLV','Lluvia fuerte'],
  71:['NEV','Nieve'],73:['NEV','Nieve'],75:['NEV','Nieve'],80:['LLV','Chaparrones'],81:['LLV','Chaparrones'],82:['TRM','Chaparrones fuertes'],95:['TRM','Tormenta'],96:['TRM','Tormenta'],99:['TRM','Tormenta']};
function wmo(c){ return WMO[c]||['---','—']; }
var climaDatos=leer('clima',null);
function posicion(){
  return new Promise(function(ok){
    var def={lat:-34.6037, lon:-58.3816, nombre:'Buenos Aires'};
    if(!navigator.geolocation) return ok(def);
    navigator.geolocation.getCurrentPosition(function(p){ ok({lat:p.coords.latitude, lon:p.coords.longitude, nombre:'Tu ubicación'}); }, function(){ ok(def); }, {timeout:8000, maximumAge:3600000});
  });
}
function cargarClima(forzar){
  if(climaDatos && !forzar && Date.now()-climaDatos.t<30*60000){ pintarClima(); return Promise.resolve(); }
  return posicion().then(function(p){
    var u='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6';
    return fetch(u).then(function(r){return r.json();}).then(function(j){ climaDatos={t:Date.now(), lugar:p.nombre, j:j}; guardar('clima',climaDatos); pintarClima(); });
  }).catch(function(){ if(abierta==='clima') $('clima-l').innerHTML='<div class="vacio">No pude cargar el clima. Revisá la conexión.</div>'; });
}
function pintarClima(){
  if(!climaDatos) return;
  var j=climaDatos.j, c=j.current, w=wmo(c.weather_code), d=j.daily;
  $('clima-w').innerHTML='<span>'+Math.round(c.temperature_2m)+'°</span> · '+esc(w[1]);
  var h='<div class="clima-hoy"><div class="d">'+esc(climaDatos.lugar)+'</div><div class="t">'+Math.round(c.temperature_2m)+'<b>°</b></div><div class="d">'+w[1]+'</div></div>';
  for(var i=0;i<d.time.length;i++){
    var f=new Date(d.time[i]+'T12:00:00'), x=wmo(d.weather_code[i]);
    h+='<div class="dia"><b>'+(i===0?'hoy':DIAS[f.getDay()])+'</b><i>'+x[0]+'</i><em>'+Math.round(d.temperature_2m_min[i])+'° / '+Math.round(d.temperature_2m_max[i])+'°</em></div>';
  }
  $('clima-l').innerHTML=h;
}

// ---------- Ajustes ----------
function pintarAjustes(){
  $('key-in').value=S.key; $('modelo-in').value=S.modelo; $('nombre-in').value=S.nombre;
  var h=''; for(var k in FONDOS){ h+='<button class="'+(S.fondo===k?'sel':'')+'" onclick="ponerFondo(\''+k+'\')"><i style="background:'+FONDOS[k]+'"></i>'+k.slice(0,3).toUpperCase()+'</button>'; }
  $('fondos').innerHTML=h;
}
function guardarAjustes(){
  S.key=$('key-in').value.trim(); S.modelo=$('modelo-in').value; S.nombre=$('nombre-in').value.trim();
  guardar('key',S.key); guardar('modelo',S.modelo); guardar('nombre',S.nombre);
  cerrar();
}
function ponerFondo(k){ if(!FONDOS[k]) return false; S.fondo=k; guardar('fondo',k); document.body.className='t-'+k; if(abierta==='ajustes') pintarAjustes(); return true; }
function borrarTodo(){
  if(!confirm('¿Borrar notas, tareas y charlas? No se puede deshacer.')) return;
  S.notas=[]; S.tareas=[]; S.historial=[]; S.chatVista=[];
  guardar('notas',[]); guardar('tareas',[]); guardar('historial',[]); guardar('chatVista',[]);
}

// =========================================================
//   CLAUDE: el asistente que controla el launcher
// =========================================================
var HERRAMIENTAS=[
  {name:'crear_nota', description:'Guarda una nota en la app Notas del launcher.',
   input_schema:{type:'object', properties:{titulo:{type:'string'}, texto:{type:'string'}}, required:['texto']}},
  {name:'borrar_nota', description:'Borra una nota por su id.',
   input_schema:{type:'object', properties:{id:{type:'string'}}, required:['id']}},
  {name:'crear_tarea', description:'Agrega una tarea pendiente a la app Tareas. fecha es texto libre opcional (ej. "mañana 10hs").',
   input_schema:{type:'object', properties:{texto:{type:'string'}, fecha:{type:'string'}}, required:['texto']}},
  {name:'completar_tarea', description:'Marca una tarea como hecha por su id.',
   input_schema:{type:'object', properties:{id:{type:'string'}}, required:['id']}},
  {name:'abrir_app', description:'Abre una app del launcher. La persona tiene que tocar el botón que aparece en el chat para confirmar.',
   input_schema:{type:'object', properties:{app:{type:'string', enum:APPS.map(function(a){return a.id;})}}, required:['app']}},
  {name:'preparar_contacto', description:'Prepara un botón para llamar, mandar SMS o mail, o buscar un lugar en Mapas. La persona lo toca para ejecutarlo.',
   input_schema:{type:'object', properties:{tipo:{type:'string', enum:['llamar','sms','mail','mapa']}, valor:{type:'string', description:'Número, dirección de mail o lugar a buscar'}, texto:{type:'string', description:'Cuerpo del SMS o asunto del mail (opcional)'}}, required:['tipo','valor']}},
  {name:'cambiar_fondo', description:'Cambia el tema de color neón del launcher (neon=cian, magenta, acido=verde lima, ambar, mono=blanco y gris).',
   input_schema:{type:'object', properties:{fondo:{type:'string', enum:Object.keys(FONDOS)}}, required:['fondo']}},
  {name:'ver_clima', description:'Devuelve el clima actual y el pronóstico de 6 días de la ubicación de la persona.',
   input_schema:{type:'object', properties:{}}}
];

function sistema(){
  var n=new Date();
  var pend=S.tareas.filter(function(t){return !t.hecha;}).map(function(t){return '- ['+t.id+'] '+t.texto+(t.fecha?' ('+t.fecha+')':'');}).join('\n')||'(ninguna)';
  var notas=S.notas.slice(-15).map(function(x){return '- ['+x.id+'] '+(x.titulo||'Sin título')+': '+x.texto.slice(0,140);}).join('\n')||'(ninguna)';
  return 'Sos Claude, el asistente que controla "Lienzo", el sistema de inicio de un iPhone 6.'+
    (S.nombre?' La persona se llama '+S.nombre+'.':'')+
    ' Hablá en español rioplatense, breve y claro: la pantalla es chica (4,7"). Sin markdown complejo ni emojis; a lo sumo **negrita**. La estética del launcher es cyberpunk minimalista.'+
    ' Usá las herramientas cuando la persona pida guardar, recordar, organizar, abrir algo o cambiar el aspecto del teléfono. Si algo no se puede hacer desde acá (alarmas del sistema, cámara en vivo, ajustes de iOS), decilo y sugerí la alternativa.'+
    '\n\nAhora: '+DIAS[n.getDay()]+' '+n.getDate()+' de '+MESES[n.getMonth()]+' de '+n.getFullYear()+', '+n.toTimeString().slice(0,5)+'.'+
    '\n\nTareas pendientes:\n'+pend+'\n\nÚltimas notas:\n'+notas;
}

function ejecutar(nombre, input){
  var r;
  switch(nombre){
    case 'crear_nota': r=agregarNota(input.titulo||'', input.texto); return {res:'Nota guardada (id '+r.id+').', vista:'[+] Nota guardada'};
    case 'borrar_nota': S.notas=S.notas.filter(function(n){return n.id!==input.id;}); guardar('notas',S.notas); return {res:'Nota borrada.', vista:'[-] Nota borrada'};
    case 'crear_tarea': r=agregarTarea(input.texto, input.fecha); return {res:'Tarea creada (id '+r.id+').', vista:'[+] Tarea: '+input.texto};
    case 'completar_tarea':
      var ok=false; S.tareas.forEach(function(t){ if(t.id===input.id){ t.hecha=true; ok=true; } }); guardar('tareas',S.tareas);
      return {res: ok?'Tarea completada.':'No encontré esa tarea.', vista: ok?'[x] Tarea completada':null};
    case 'abrir_app':
      var a=APPS.filter(function(x){return x.id===input.app;})[0];
      if(!a) return {res:'Esa app no existe.'};
      return {res:'Botón para abrir '+a.n+' mostrado.', boton:{txt:'Abrir '+a.n, app:a.id}};
    case 'preparar_contacto':
      var v=String(input.valor||''), u='', t='';
      if(input.tipo==='llamar'){ u='tel:'+v.replace(/[^\d+]/g,''); t='Llamar › '+v; }
      else if(input.tipo==='sms'){ u='sms:'+v.replace(/[^\d+]/g,'')+(input.texto?'&body='+encodeURIComponent(input.texto):''); t='SMS › '+v; }
      else if(input.tipo==='mail'){ u='mailto:'+v+(input.texto?'?subject='+encodeURIComponent(input.texto):''); t='Mail › '+v; }
      else { u='https://maps.apple.com/?q='+encodeURIComponent(v); t='Mapa › '+v; }
      return {res:'Botón preparado.', boton:{txt:t, url:u}};
    case 'cambiar_fondo': return ponerFondo(input.fondo)?{res:'Fondo cambiado.', vista:'[*] Tema: '+input.fondo}:{res:'Fondo inválido.'};
    case 'ver_clima':
      return cargarClima(false).then(function(){
        if(!climaDatos) return {res:'No hay datos de clima.'};
        var j=climaDatos.j, d=j.daily, s='Ahora '+Math.round(j.current.temperature_2m)+'°, '+wmo(j.current.weather_code)[1]+'. Pronóstico:';
        for(var i=0;i<d.time.length;i++) s+=' '+d.time[i]+': '+wmo(d.weather_code[i])[1]+' '+Math.round(d.temperature_2m_min[i])+'-'+Math.round(d.temperature_2m_max[i])+'°;';
        return {res:s};
      });
  }
  return {res:'Herramienta desconocida.'};
}

// ---------- Vista del chat ----------
function textoAHTML(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function burbuja(m){
  if(m.r==='s') return '<div class="msg s">'+esc(m.t)+'</div>';
  if(m.r==='b') return '<div class="msg a btnw"><button class="accion" onclick="'+(m.app?'abrir(\''+m.app+'\')':'window.location.href=\''+esc(m.url).replace(/'/g,'%27')+'\'')+'">'+esc(m.t)+'</button></div>';
  return '<div class="msg '+m.r+'">'+(m.img?'<img src="'+m.img+'">':'')+textoAHTML(m.t||'')+'</div>';
}
function pintarChat(){
  var el=$('msgs');
  if(!S.chatVista.length) el.innerHTML='<div class="msg s">Hola'+(S.nombre?' '+esc(S.nombre):'')+'. Puedo guardar notas, armar tareas, ver el clima, preparar llamadas y mensajes, o cambiar el tema de color. ¿Qué necesitás?</div>';
  else el.innerHTML=S.chatVista.map(burbuja).join('');
  el.scrollTop=el.scrollHeight;
}
function mostrar(m){
  // las miniaturas no se guardan para no llenar el almacenamiento
  var copia={r:m.r,t:m.t,url:m.url,app:m.app};
  if(m.img) copia.t='[img] '+(m.t||'');
  S.chatVista.push(copia); if(S.chatVista.length>80) S.chatVista=S.chatVista.slice(-80);
  guardar('chatVista',S.chatVista);
  var el=$('msgs'); if(S.chatVista.length===1) el.innerHTML='';
  el.insertAdjacentHTML('beforeend', burbuja(m)); el.scrollTop=el.scrollHeight;
}
function escribiendo(on){
  var x=$('dots'); if(x) x.parentNode.removeChild(x);
  if(on){ $('msgs').insertAdjacentHTML('beforeend','<div class="msg a dots" id="dots"><span></span><span></span><span></span></div>'); $('msgs').scrollTop=$('msgs').scrollHeight; }
}
function avisoSinClave(){ if(!S.chatVista.length) $('msgs').insertAdjacentHTML('beforeend','<div class="msg s">Primero cargá tu clave de API en Ajustes.</div><div class="msg a btnw"><button class="accion" onclick="abrir(\'ajustes\')">Ir a Ajustes</button></div>'); }
function nuevaCharla(){ S.historial=[]; S.chatVista=[]; guardar('historial',[]); guardar('chatVista',[]); pintarChat(); }

// ---------- Foto (se achica antes de enviar) ----------
var fotoPendiente=null;
$('foto-in').addEventListener('change', function(){
  var f=this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1024, w=img.width, h=img.height, k=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      fotoPendiente=c.toDataURL('image/jpeg',0.8);
      $('adjunto').style.display='block';
    };
    img.src=r.result;
  };
  r.readAsDataURL(f); this.value='';
});
function quitarFoto(){ fotoPendiente=null; $('adjunto').style.display='none'; }

// ---------- Llamada a la API ----------
function recortarHistorial(){
  // conserva ~24 mensajes y arranca siempre en un mensaje de la persona (no en un tool_result)
  var h=S.historial; if(h.length<=24) return;
  var i=h.length-24;
  while(i<h.length){ var m=h[i]; if(m.role==='user' && !(Array.isArray(m.content) && m.content.some(function(b){return b.type==='tool_result';}))) break; i++; }
  S.historial=h.slice(i);
}
function sinImagenes(h){
  return h.map(function(m){
    if(!Array.isArray(m.content)) return m;
    return {role:m.role, content:m.content.map(function(b){ return b.type==='image'?{type:'text',text:'[foto enviada antes]'}:b; })};
  });
}
function llamarAPI(){
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.modelo, max_tokens:1024, system:sistema(), tools:HERRAMIENTAS, messages:S.historial})
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){ var e=new Error((j.error && j.error.message)||('Error '+r.status)); e.status=r.status; throw e; }
      return j;
    });
  });
}
var ocupado=false;
async function enviar(){
  var t=$('txt').value.trim();
  if(ocupado || (!t && !fotoPendiente)) return;
  if(!S.key){ avisoSinClave(); return; }
  ocupado=true; $('txt').value=''; ajustarTxt();
  var contenido=[];
  if(fotoPendiente) contenido.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data:fotoPendiente.split(',')[1]}});
  contenido.push({type:'text', text:t||'¿Qué ves en esta foto?'});
  mostrar({r:'u', t:t, img:fotoPendiente}); quitarFoto();
  var base=S.historial.length;
  S.historial.push({role:'user', content:contenido});
  try{
    for(var vuelta=0; vuelta<6; vuelta++){
      escribiendo(true);
      var j=await llamarAPI();
      escribiendo(false);
      S.historial.push({role:'assistant', content:j.content});
      var resultados=[];
      for(var i=0;i<j.content.length;i++){
        var b=j.content[i];
        if(b.type==='text' && b.text.trim()) mostrar({r:'a', t:b.text.trim()});
        if(b.type==='tool_use'){
          var out=await Promise.resolve(ejecutar(b.name, b.input||{}));
          if(out.vista) mostrar({r:'s', t:out.vista});
          if(out.boton) mostrar({r:'b', t:out.boton.txt, url:out.boton.url, app:out.boton.app});
          resultados.push({type:'tool_result', tool_use_id:b.id, content:out.res});
        }
      }
      if(j.stop_reason!=='tool_use' || !resultados.length) break;
      S.historial.push({role:'user', content:resultados});
    }
  }catch(e){
    escribiendo(false);
    var msg = e.status===401 ? 'La clave de API no es válida. Revisala en Ajustes.' :
              e.status===429 ? 'Demasiados pedidos seguidos o sin saldo. Probá en un rato.' :
              (e.message==='Load failed'||e.message==='Failed to fetch') ? 'Sin conexión a internet.' : 'Error: '+e.message;
    mostrar({r:'s', t:msg});
    // si falló, descarta el turno entero para que el historial no quede roto
    S.historial=S.historial.slice(0, base);
  }
  S.historial=sinImagenes(S.historial); recortarHistorial(); guardar('historial',S.historial);
  ocupado=false;
}

// ---------- Entrada de texto ----------
function ajustarTxt(){ var x=$('txt'); x.style.height='auto'; x.style.height=Math.min(x.scrollHeight,110)+'px'; }
$('txt').addEventListener('input', ajustarTxt);
$('tarea-in').addEventListener('keydown', function(e){ if(e.keyCode===13 && this.value.trim()){ agregarTarea(this.value.trim()); this.value=''; pintarTareas(); } });

// ---------- Arranque ----------
pintarInicio(); reloj(); setInterval(reloj, 15000);
if(climaDatos) pintarClima();
cargarClima(false);
</script>
